{% extends "layouts/base.html" %}
{% block title %}Reset Password | {{ business_name }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🔒</div>
      <h1>Set new password</h1>
      <p class="subtitle">Choose a strong password for your account</p>
    </div>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" class="form-control" required minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Repeat new password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>
    <p class="auth-footer"><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
  </div>
</section>
{% endblock %}
