{% extends "layouts/base.html" %}
{% block title %}Forgot Password | {{ business_name }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🔑</div>
      <h1>Forgot password?</h1>
      <p class="subtitle">Enter your email and we'll send a reset link</p>
    </div>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>
    <p class="auth-footer"><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
  </div>
</section>
{% endblock %}
