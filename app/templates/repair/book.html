{% extends "layouts/base.html" %}
{% block title %}Book a Repair | {{ business_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:700px">
<h1 style="margin-bottom:1.5rem">Book a Repair</h1>
<p style="color:var(--text-muted);margin-bottom:1rem">Our team (admin) will pick up your phone from the address you provide. No self-drop needed.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-row">
<div class="form-group"><label>Full Name *</label><input type="text" name="name" class="form-control" required value="{{ current_user.full_name if current_user.is_authenticated else '' }}"></div>
<div class="form-group"><label>Mobile *</label><input type="tel" name="mobile" class="form-control" required value="{{ current_user.mobile if current_user.is_authenticated else '' }}"></div>
</div>
<div class="form-group"><label>Email *</label><input type="email" name="email" class="form-control" required value="{{ current_user.email if current_user.is_authenticated else '' }}"></div>
<div class="form-row">
<div class="form-group"><label>Phone Brand *</label><input type="text" name="phone_brand" class="form-control" required placeholder="e.g. Samsung"></div>
<div class="form-group"><label>Model *</label><input type="text" name="phone_model" class="form-control" required placeholder="e.g. Galaxy A54"></div>
</div>
<div class="form-group"><label>Problem Description *</label><textarea name="problem_description" class="form-control" rows="3" required></textarea></div>
<div class="form-group"><label>Pickup Address *</label><textarea name="pickup_address" class="form-control" rows="2" required></textarea></div>
<div class="form-group"><label>Pickup Instructions</label><input type="text" name="pickup_instructions" class="form-control"></div>
<input type="hidden" name="pickup_latitude" id="pickup_lat">
<input type="hidden" name="pickup_longitude" id="pickup_lng">
<div class="form-group">
<label>Select Pickup Location on Map</label>
<button type="button" id="use-my-location" class="btn btn-outline btn-sm" style="margin-bottom:0.5rem">Use My Location</button>
<div id="pickup-map" class="map-container" data-tile-url="{{ map_tile_url }}"></div>
</div>
<button type="submit" class="btn btn-primary btn-lg" style="width:100%">Submit Repair Request</button>
</form></div></section>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (window.MCMaps) {
    MCMaps.initPickupPicker('pickup-map',
      document.getElementById('pickup_lat'),
      document.getElementById('pickup_lng'),
      null);
  }
});
</script>
{% endblock %}
