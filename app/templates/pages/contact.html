{% extends "layouts/base.html" %}
{% block title %}Contact | {{ business_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:600px">
<h1 style="margin-bottom:1.5rem">Contact Us</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Name</label><input type="text" name="name" class="form-control" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required></div>
<div class="form-group"><label>Message</label><textarea name="message" class="form-control" rows="5" required></textarea></div>
<button type="submit" class="btn btn-primary">Send Message</button></form>
<p style="margin-top:2rem">Email: <a href="mailto:{{ business_email }}">{{ business_email }}</a><br>Phone: {{ business_phone }}</p>
</div></section>{% endblock %}
