{% extends "layouts/admin_base.html" %}
{% block title %}Add Exchange Phone | {{ business_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Add phone for exchange</h1>
  <a href="{{ url_for('admin.exchanges') }}" class="btn btn-ghost btn-sm">← Back</a>
</div>
<p style="color:var(--text-muted);margin-bottom:1rem">Only name, model, photos and exchange details — for exchange interest, not full sale listing.</p>
<form method="post" enctype="multipart/form-data" style="max-width:560px;background:#fff;padding:1.5rem;border-radius:12px;border:1px solid var(--border)">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>Phone name / title *</label><input type="text" name="title" class="form-control" required placeholder="e.g. iPhone 12 128GB"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div class="form-group"><label>Brand *</label><input type="text" name="brand" class="form-control" required></div>
    <div class="form-group"><label>Model *</label><input type="text" name="model" class="form-control" required></div>
  </div>
  <div class="form-group">
    <label>Condition</label>
    <select name="condition" class="form-control">
      {% for c in conditions %}<option>{{ c }}</option>{% endfor %}
    </select>
  </div>
  <div class="form-group"><label>Short description</label><textarea name="description" class="form-control" rows="3" placeholder="Battery, storage, notes…"></textarea></div>
  <div class="form-group"><label>What you want in exchange *</label><textarea name="exchange_requirements" class="form-control" rows="3" required placeholder="e.g. Samsung S21 or similar + some cash"></textarea></div>
  <div class="form-group"><label>Location</label><input type="text" name="location" class="form-control" value="Urlabari"></div>
  <div class="form-group"><label>Photos *</label><input type="file" name="photos" class="form-control" accept="image/*" multiple></div>
  <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Publish exchange listing</button>
</form>
{% endblock %}
