{% extends "layouts/base.html" %}
{% block title %}Change Password | {{ business_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:440px">
<div class="auth-card" style="margin:0"><h1>Change Password</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Current Password</label><input type="password" name="current_password" class="form-control" required></div>
<div class="form-group"><label>New Password</label><input type="password" name="new_password" class="form-control" required minlength="8"></div>
<div class="form-group"><label>Confirm</label><input type="password" name="confirm_password" class="form-control" required></div>
<button type="submit" class="btn btn-primary" style="width:100%">Update</button>
</form></div></div></section>{% endblock %}
