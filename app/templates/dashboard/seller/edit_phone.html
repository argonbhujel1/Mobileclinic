{% extends "layouts/base.html" %}
{% block title %}Edit Listing | {{ business_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:640px">
<h1 style="margin-bottom:1rem">Edit: {{ product.title }}</h1>

{% if images %}
<div style="background:#fff;padding:1rem;border-radius:12px;border:1px solid var(--border);margin-bottom:1rem">
  <label style="font-weight:600">Current photos</label>
  <div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:0.5rem">
    {% for img in images %}
    <div style="width:88px">
      <img src="{{ img.cloudinary_url }}" style="width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">
      <form method="post" action="{{ url_for('dashboard.seller_image_delete', product_id=product.id, image_id=img.id) }}" onsubmit="return confirm('Remove this photo?');" style="margin-top:0.35rem">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-ghost btn-sm" style="width:100%;color:#b91c1c;font-size:0.75rem">Remove</button>
      </form>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}

<form method="post" action="{{ url_for('dashboard.seller_edit_phone', product_id=product.id) }}" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>Title</label><input type="text" name="title" class="form-control" value="{{ product.title }}" required></div>
  <div class="form-group"><label>Full price (NPR)</label><input type="number" name="selling_price" class="form-control" value="{{ product.selling_price }}" required min="1"></div>
  <div class="form-group">
    <label>Minimum QR payment (NPR)</label>
    <input type="number" name="min_qr_amount" class="form-control" min="1" step="1"
      value="{{ product.min_qr_amount if product.min_qr_amount is not none else product.selling_price }}">
  </div>
  <div class="form-group"><label>Stock</label><input type="number" name="stock_quantity" class="form-control" value="{{ product.stock_quantity }}" min="0"></div>
  <div class="form-group"><label>Description</label><textarea name="description" class="form-control" rows="4" required>{{ product.description }}</textarea></div>
  <div class="form-group" style="background:#f0f9ff;padding:0.85rem;border-radius:10px;margin-bottom:1rem">
    <label><input type="checkbox" name="allows_exchange" value="1" {% if product.allows_exchange %}checked{% endif %}> Open for exchange</label>
    <textarea name="exchange_requirements" class="form-control" rows="2" style="margin-top:0.5rem" placeholder="What you want in exchange">{{ product.exchange_requirements or '' }}</textarea>
  </div>
  <div class="form-group"><label><input type="checkbox" name="is_active" value="1" {% if product.is_active %}checked{% endif %}> Active (visible in shop)</label></div>
  <div class="form-group"><label>Add photos</label><input type="file" name="photos" class="form-control" accept="image/*" multiple></div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('dashboard.seller') }}" class="btn btn-ghost">Back</a>
</form>
</div></section>
{% endblock %}
