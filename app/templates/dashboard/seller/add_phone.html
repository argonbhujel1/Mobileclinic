{% extends "layouts/base.html" %}
{% block title %}Add Phone | {{ business_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:700px">
<h1 style="margin-bottom:1.5rem">Add Phone Listing</h1>
<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Title *</label><input type="text" name="title" class="form-control" required></div>
<div class="form-row">
<div class="form-group"><label>Brand *</label><input type="text" name="brand" class="form-control" required></div>
<div class="form-group"><label>Model *</label><input type="text" name="model" class="form-control" required></div>
</div>
<div class="form-row">
<div class="form-group"><label>Variant</label><input type="text" name="variant" class="form-control"></div>
<div class="form-group"><label>RAM</label><input type="text" name="ram" class="form-control" placeholder="e.g. 8GB"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Storage</label><input type="text" name="storage" class="form-control" placeholder="e.g. 128GB"></div>
<div class="form-group"><label>Condition *</label><select name="condition" class="form-control" required><option>Like New</option><option>Excellent</option><option>Good</option><option>Fair</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label>Selling Price (NPR) *</label><input type="number" name="selling_price" class="form-control" required min="1"></div>
<div class="form-group"><label><input type="checkbox" name="is_negotiable"> Negotiable</label></div>
</div>
<div class="form-group"><label>Description *</label><textarea name="description" class="form-control" rows="4" required></textarea></div>
<div class="form-group"><label>IMEI/Serial (private)</label><input type="text" name="imei_serial" class="form-control"></div>
<div class="form-group"><label>Category</label><select name="category_id" class="form-control">{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
<div class="form-row">
<div class="form-group"><label>Warranty</label><select name="warranty_status" class="form-control"><option>No Warranty</option><option>Brand Warranty</option><option>Seller Warranty</option></select></div>
<div class="form-group"><label>Warranty Details</label><input type="text" name="warranty_details" class="form-control"></div>
</div>
<div class="form-group"><label>Accessories</label><input type="text" name="accessories" class="form-control" value="No Accessories"></div>
<div class="form-group"><label>Location *</label><input type="text" name="location" class="form-control" required></div>
<div class="form-row">
<div class="form-group"><label>Stock</label><input type="number" name="stock_quantity" class="form-control" value="1" min="1"></div>
<div class="form-group"><label>Payment Method</label><select name="payment_method" class="form-control"><option value="both">Both</option><option value="cod">COD</option><option value="qr">QR</option></select></div>
</div>
<div class="form-group"><label>Photos * (min 4 for sellers)</label><input type="file" name="photos" class="form-control" accept="image/*" multiple data-image-preview="#img-preview"><div id="img-preview" style="display:flex;flex-wrap:wrap;margin-top:0.5rem"></div></div>
<div class="form-group">
<label>Minimum QR payment (NPR)</label>
<input type="number" name="min_qr_amount" class="form-control" min="1" step="1" placeholder="e.g. 5000 if full price is 25000">
<small style="color:var(--text-muted)">Buyer must pay at least this via QR. You/admin confirm order after verifying payment.</small>
</div>
<div class="form-group" style="background:#f0f9ff;padding:0.85rem;border-radius:10px">
<label><input type="checkbox" name="allows_exchange" value="1"> Open for exchange</label>
<textarea name="exchange_requirements" class="form-control" rows="2" style="margin-top:0.5rem" placeholder="Exchange requirements (what you want in return)"></textarea>
</div>
<button type="submit" class="btn btn-primary btn-lg" style="width:100%">List Phone</button>
</form></div></section>{% endblock %}
