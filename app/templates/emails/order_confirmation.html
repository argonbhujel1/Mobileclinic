<!DOCTYPE html><html><body style="font-family:sans-serif;max-width:560px;margin:0 auto;padding:24px">
<div style="background:linear-gradient(135deg,#1e40af,#3b82f6);color:white;padding:24px;border-radius:12px 12px 0 0;text-align:center"><h1 style="margin:0">Order Confirmed</h1></div>
<div style="border:1px solid #e2e8f0;border-top:none;padding:24px;border-radius:0 0 12px 12px">
<p>Hi {{ order.guest_name }},</p>
<p>Your order <strong>{{ order.order_id }}</strong> has been received.</p>
<p>Total: <strong>NPR {{ "{:,.0f}".format(order.total_amount) }}</strong> · {{ order.payment_method|upper }}</p>
<p><a href="{{ tracking_url }}" style="display:inline-block;background:#1e40af;color:white;padding:12px 24px;border-radius:8px;text-decoration:none">Track Order</a></p>
</div></body></html>
